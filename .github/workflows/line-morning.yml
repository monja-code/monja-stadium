name: 朝のLINE（今日の勉強）

on:
  schedule:
    # 日本時間 5:40（GitHub の予約は混むと数分〜30分ほど遅れるので早めに）
    - cron: '40 20 * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 今日の計画をLINEで送る
        shell: pwsh
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: ./scripts/line-morning.ps1
